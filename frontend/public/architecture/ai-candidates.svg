<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <style>
    .title{font:18px sans-serif; fill:#0f172a}
    .card{fill:#ffffff; stroke:#e2e8f0; rx:8}
    .name{font:14px sans-serif; fill:#0f172a}
    .score{font:12px sans-serif; fill:#059669}
  </style>
  <rect width="900" height="360" fill="#f8fafc" rx="8"/>
  <text x="20" y="30" class="title">AI Candidate Summary Cards</text>

  <g transform="translate(40,60)">
    <rect class="card" x="0" y="0" width="240" height="80"/>
    <text x="16" y="28" class="name">Alice Nguyen</text>
    <text x="16" y="52" class="score">Score: 92 — Skills match: Python, SQL, React</text>

    <rect class="card" x="280" y="0" width="240" height="80"/>
    <text x="296" y="28" class="name">Rahul Patel</text>
    <text x="296" y="52" class="score">Score: 84 — Skills match: FastAPI, SQLAlchemy</text>

    <rect class="card" x="560" y="0" width="240" height="80"/>
    <text x="576" y="28" class="name">Maria Lopez</text>
    <text x="576" y="52" class="score">Score: 76 — Skills match: Frontend, Tailwind</text>
  </g>

  <text x="20" y="320" class="label">Cards are generated by the scoring pipeline for quick review.</text>
</svg>
