<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="360" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <style>
    .box { fill:#fff; stroke:#0ea5a4; stroke-width:2; rx:8 }
    .label { font:14px sans-serif; fill:#0f172a }
    .title { font:18px sans-serif; fill:#0ea5a4; font-weight:700 }
    .arrow { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>
  <text x="20" y="30" class="title">Resume Processing Flow</text>

  <rect class="box" x="20" y="60" width="200" height="80"/>
  <text x="40" y="100" class="label">1. Upload Resume</text>

  <rect class="box" x="260" y="60" width="200" height="80"/>
  <text x="280" y="90" class="label">2. Parse (PDF/Text)</text>

  <rect class="box" x="500" y="60" width="200" height="80"/>
  <text x="520" y="90" class="label">3. Score & Match</text>

  <rect class="box" x="740" y="60" width="120" height="80"/>
  <text x="750" y="100" class="label">4. Dashboard</text>

  <path class="arrow" d="M220 100 L260 100"/>
  <path class="arrow" d="M460 100 L500 100"/>
  <path class="arrow" d="M700 100 L740 100"/>

  <text x="20" y="170" class="label">• Parser extracts skills, experience, education.</text>
  <text x="20" y="190" class="label">• Scoring compares resume to job description and ranks matches.</text>
</svg>
