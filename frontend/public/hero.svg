<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <style>
    .bg { fill: #0f172a }
    .accent { fill: #06b6d4 }
    .text { fill: #ffffff; font: 24px sans-serif }
    .sub { fill: #e6f7f9; font: 16px sans-serif }
  </style>
  <rect width="1200" height="360" class="bg" rx="8"/>
  <circle cx="240" cy="180" r="100" class="accent" opacity="0.12"/>
  <circle cx="420" cy="140" r="60" class="accent" opacity="0.16"/>

  <text x="520" y="120" class="text">Smart Resume Screener</text>
  <text x="520" y="160" class="sub">Parse resumes, rank candidates, and manage matches — faster.</text>

  <!-- Simple abstract illustration of a resume -->
  <rect x="80" y="110" width="220" height="260" rx="12" fill="#ffffff" opacity="0.06"/>
  <rect x="120" y="140" width="140" height="18" rx="4" fill="#ffffff" opacity="0.12"/>
  <rect x="120" y="170" width="180" height="12" rx="3" fill="#ffffff" opacity="0.08"/>
  <rect x="120" y="190" width="100" height="12" rx="3" fill="#ffffff" opacity="0.08"/>
</svg>
